name: Validate quest data

on:
  push:
  pull_request:

jobs:
  validate-bountiful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bountiful config-pack content
        run: python tools/validate_bountiful_content.py
