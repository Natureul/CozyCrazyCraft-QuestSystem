name: Validate quest data

on:
  push:
  pull_request:

jobs:
  validate-quest-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bountiful config-pack content
        run: python tools/validate_bountiful_content.py
      - name: Validate neutral regional quest catalog
        run: python tools/validate_quest_catalog.py
      - name: Validate repeatable regional expansion
        run: python tools/validate_repeatable_expansion.py
      - name: Validate human-readable authored quest browser
        run: python tools/validate_quest_browser.py
      - name: Validate human-readable field-job browser
        run: python tools/validate_field_job_browser.py
      - name: Validate regional board policy
        run: python tools/validate_board_policy.py
      - name: Validate automatic board decree assignment
        run: python tools/validate_board_decree_assignment.py
      - name: Validate village board guarantee policy
        run: python tools/validate_village_board_policy.py
      - name: Validate village trust and cadence policy
        run: python tools/validate_village_trust_policy.py
      - name: Validate structure recovery contracts
        run: python tools/validate_structure_recovery.py
      - name: Validate target distance and selection policy
        run: python tools/validate_targeting_policy.py
      - name: Validate CozyCrazyZones world bindings
        run: python tools/validate_world_bindings.py
      - name: Validate cartographer map prototype
        run: python tools/validate_cartographer_prototype.py
      - name: Validate story-board metadata
        run: python tools/validate_story_ui.py
      - name: Validate regional field-job story metadata
        run: python tools/validate_field_story_ui.py
      - name: Build playtest root overlay
        run: python tools/build_playtest_overlay.py
      - name: Build regional cartographer prototype
        run: python tools/build_cartographer_prototype.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build CozyCrazyQuests runtime
        run: gradle -p runtime build --stacktrace
      - name: Build integrated quest-system playtest
        run: python tools/build_integrated_playtest.py

      - name: Upload playtest root overlay
        uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyCraft-QuestSystem-PLAYTEST_ROOT_OVERLAY
          path: build/CozyCrazyCraft-QuestSystem-PLAYTEST_ROOT_OVERLAY.zip
          if-no-files-found: error
      - name: Upload regional cartographer prototype
        uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyCraft-Regional-Cartographer-PROTOTYPE
          path: build/CozyCrazyCraft-Regional-Cartographer-PROTOTYPE.zip
          if-no-files-found: error
      - name: Upload CozyCrazyQuests runtime jar
        uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyQuests-RUNTIME
          path: runtime/build/libs/CozyCrazyQuests-*.jar
          if-no-files-found: error
      - name: Upload integrated quest-system playtest
        uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyCraft-QuestSystem-INTEGRATED_PLAYTEST
          path: build/CozyCrazyCraft-QuestSystem-INTEGRATED_PLAYTEST_ROOT_OVERLAY.zip
          if-no-files-found: error
